experiment:
  name: probe_bc_mlp
  controller_family: pd_residual
  evaluation_mode: train_supervised
  resource_tier: gpu_probe

output:
  root: /WAVE/datasets/ccoelho_lab-jlanders/etude/20260519_tracking_dataset_4a884b7_r2/runs_probe
  subdir: probe_bc_mlp

execution:
  kind: train_supervised
  allow_execute: true
  requires_dataset: true
  requires_gpu: true
  requires_rollout: false

data:
  dataset_root: /WAVE/datasets/ccoelho_lab-jlanders/etude/20260519_tracking_dataset_4a884b7_r2/views/train_probe_24
  batch_size: 256
  sequence_length: 16
  num_workers: 2
  normalize: false

features:
  tracking:
    lookahead_steps: [1, 5, 10]
    include_target_keys: true
    include_fingertips: false

trajectory:
  dt: 0.005
  reference_dim: 46
  lookahead_steps: [1, 5, 10]
  control_rate_hz: 200

controller:
  type: hybrid_pd_residual
  residual_model: mlp
  hidden_dim: 256
  num_layers: 3
  dropout: 0.05
  activation: gelu

pd:
  enabled: true
  kp_init: 12.0
  kd_init: 0.6
  action_clip: true

training:
  epochs: 12
  lr: 3.0e-4
  weight_decay: 1.0e-5
  gradient_clip_norm: 1.0
  device: cuda
  mixed_precision: false

wandb:
  enabled: false
