wandb:
  enabled: true
  project: robopianist
  entity: tnguyen31-santa-clara-university
  mode: online
  group: Fugue
  tags: [fugue, model-f, planner-next, inverse-dynamics, multisong, heldout-song]

dataset:
  song_keys:
    - RoboPianist-debug-TwinkleTwinkleLittleStar-v0_0
    - RoboPianist-GP-AdamsAEmmettTheBellsOfStMarys-v0_0
    - RoboPianist-GP-AdlerVincentGrandeMarcheOp24-v0_0
    - RoboPianist-GP-AgnewRoy2PianoPieces-v0_0
    - RoboPianist-GP-AgnewRoyYouthfulFancies-v0_0
    - RoboPianist-GP-AkimenkoTheodore3MorceauxOp16-v0_0
    - RoboPianist-GP-AkimenkoTheodoreAuCoinDuFeuOp28-v0_0
    - RoboPianist-GP-AkimenkoTheodoreJeuxOp34-v0_0
    - RoboPianist-GP-AksakovSergey4Pieces-v0_0
    - RoboPianist-GP-AlaisJuan6EstilosCriollosOp8-v0_0
    - RoboPianist-GP-AlbaAntonioElEnsuenoOp16-v0_0
    - RoboPianist-GP-AlbaAntonioPitios-v0_0
    - RoboPianist-GP-AlbaAntonioSensitiva-v0_0
    - RoboPianist-GP-AlbenizIsaacPavanaCaprichoOp12-v0_0
    - RoboPianist-GP-AlberyDorothyPreludeInDFlatMajor-v0_0
    - RoboPianist-GP-AlnaesEyvind4PianoPiecesOp13-v0_0
  split_by_song: true
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  split_seed: 7
  dt: 0.05
  normalization_max_demos_per_song: 120
  max_train_demos_per_song: 120
  max_val_demos_per_song: 80

sample:
  feature_mode: planner_next
  history: 8
  lookahead: 1
  goal_horizon: 16
  chunk_horizon: 1
  delta: 0
  include_qpos: true
  include_qvel: true
  include_action_history: true
  include_goals: true
  include_fingertips: false
  include_future_qvel: true
  oracle_future_hand_state: false
  press_window: 2

model:
  type: mlp
  hidden_dim: 512
  hidden_layers: 4
  dropout: 0.05
  layer_norm: true

training:
  batch_size: 1024
  epochs: 150
  patience: 20
  lr: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  press_weight_scale: 4.0
  smoothness_weight: 0.0
  num_workers: 0
